<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2077</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06060a">
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
:root{
  --bg:#06060a;
  --ink:#eef1ff;
  --cyan:#39e6ff;
  --pink:#ff2f8e;
  --dim:rgba(238,241,255,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  display:grid;
  place-items:center;
  padding:clamp(20px,5vw,64px);
  font-family:"Cascadia Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
/* 背景：一层极淡网格 + 一圈暗角 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(57,230,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,47,142,.05) 1px,transparent 1px);
  background-size:64px 64px,64px 64px;
  mask-image:radial-gradient(60% 60% at 50% 50%,#000 20%,transparent 100%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(72% 72% at 50% 46%,transparent 40%,rgba(0,0,0,.72) 100%);
}

.player{position:relative;width:min(320px,78vw);display:grid;justify-items:center;gap:0;z-index:1}

/* 封面：霓虹描边 + 扫描线 */
.cover{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:4px;overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(57,230,255,.55),
    0 0 22px rgba(57,230,255,.28),
    0 0 46px rgba(255,47,142,.18),
    0 18px 60px rgba(0,0,0,.9);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.02) saturate(1.05)}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
.cover::before{
  content:"";position:absolute;left:0;right:0;height:38%;top:-40%;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(57,230,255,.16),transparent);
  animation:scan 6.5s linear infinite;
}
@keyframes scan{0%{top:-40%}100%{top:110%}}

/* 进度 */
.seek{
  position:relative;width:100%;height:26px;margin-top:18px;cursor:pointer;
  display:flex;align-items:center;
}
.seek__rail{position:relative;width:100%;height:2px;background:rgba(238,241,255,.16);overflow:hidden}
.seek__fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--cyan),var(--pink));
  box-shadow:0 0 10px rgba(255,47,142,.6)}
.seek__knob{position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px var(--pink);transition:transform .18s}
.seek:hover .seek__knob{transform:scale(1.3)}

/* 时间 */
.time{
  width:100%;display:flex;justify-content:space-between;margin-top:2px;
  font-size:11px;letter-spacing:.14em;color:var(--dim);
  font-variant-numeric:tabular-nums;
}

/* 播放键 */
.play{
  margin-top:22px;width:58px;height:58px;border:0;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#06060a;
  background:linear-gradient(140deg,var(--cyan),#9df3ff 55%,var(--pink));
  box-shadow:0 0 18px rgba(57,230,255,.5),0 0 34px rgba(255,47,142,.28);
  transition:transform .18s,box-shadow .25s;
}
.play:hover{transform:scale(1.05);box-shadow:0 0 26px rgba(57,230,255,.72),0 0 46px rgba(255,47,142,.45)}
.play:active{transform:scale(.97)}
.play svg{width:22px;height:22px;display:block}
.play.is-on{background:linear-gradient(140deg,#ffd0e6,var(--pink) 60%,var(--cyan))}

/* 播放时封面轻微故障抖动 */
.player.is-playing .cover{animation:jitter 2.4s infinite steps(1)}
@keyframes jitter{
  0%,92%,100%{transform:translate(0,0)}
  93%{transform:translate(-2px,1px)}
  95%{transform:translate(2px,-1px)}
  97%{transform:translate(-1px,0)}
}
@media (prefers-reduced-motion: reduce){
  .cover::before,.player.is-playing .cover{animation:none}
}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="cover">
    <img src="./2077-cover.jpg" alt="" width="900" height="836" fetchpriority="high">
  </div>
  <div class="seek" id="seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span class="seek__rail"><span class="seek__fill" id="fill"></span></span>
    <span class="seek__knob" id="knob"></span>
  </div>
  <div class="time"><span id="now">0:00</span><span id="end">0:00</span></div>
  <button class="play" id="play" type="button" aria-label="播放">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
  </button>
</div>
<audio id="song" src="./2077.mp3" preload="metadata"></audio>
<script>
(function () {
  var audio = document.getElementById('song');
  var play = document.getElementById('play');
  var player = document.getElementById('player');
  var seek = document.getElementById('seek');
  var fill = document.getElementById('fill');
  var knob = document.getElementById('knob');
  var now = document.getElementById('now');
  var end = document.getElementById('end');

  function fmt(t) {
    if (!isFinite(t)) return '0:00';
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }
  function paint() {
    var d = audio.duration, c = audio.currentTime;
    var p = d ? (c / d) * 100 : 0;
    fill.style.width = p + '%';
    knob.style.left = p + '%';
    seek.setAttribute('aria-valuenow', Math.round(p));
    now.textContent = fmt(c);
  }
  function syncBtn() {
    var on = !audio.paused;
    play.classList.toggle('is-on', on);
    player.classList.toggle('is-playing', on);
    play.setAttribute('aria-label', on ? '暂停' : '播放');
    play.innerHTML = on
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  }

  play.addEventListener('click', function () {
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  audio.addEventListener('play', syncBtn);
  audio.addEventListener('pause', syncBtn);
  audio.addEventListener('ended', function () { syncBtn(); paint(); });
  audio.addEventListener('loadedmetadata', function () { end.textContent = fmt(audio.duration); paint(); });
  audio.addEventListener('timeupdate', paint);

  function seekTo(x) {
    if (!audio.duration) return;
    var r = seek.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (x - r.left) / r.width));
    audio.currentTime = ratio * audio.duration;
    paint();
  }
  seek.addEventListener('pointerdown', function (e) {
    seek.setPointerCapture(e.pointerId);
    seekTo(e.clientX);
    seek.onpointermove = function (ev) { seekTo(ev.clientX); };
  });
  seek.addEventListener('pointerup', function (e) {
    seek.onpointermove = null;
    try { seek.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  seek.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      audio.currentTime += (e.key === 'ArrowRight' ? 5 : -5);
      paint();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); play.click(); }
  });
})();
</script>
</body>
</html>
